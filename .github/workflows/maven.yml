# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Imperator Server Deploy

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    
    - name: Build docker image
      run: docker build -t imperator-server:latest .

    - name: Run docker container
      run: docker run -d --name imperator-server -p 8080:8080 imperator-server:latest

      # Must wait until the app starts
    - name: Wait for server to start
      run: |
        for i in {1..30}; do
          if wget -qO- http://localhost:8080/health > /dev/null; then
            echo "Server is UP!"
            exit 0
          fi
          echo "Waiting for server to start... ($i/30)"
          sleep 2
        done
        echo "Server did NOT start in time" >&2
        docker logs imperator-server
        exit 1

    - name: Check Server Health Response
      run: |
        RESPONSE=$(wget -qO- http://localhost:8080/health)
        echo "Response: $RESPONSE"
        if [[ "$RESPONSE" != "<h1>Health Page</h1>" ]]; then
          echo "Unexpected server response"
          exit 1
        fi
        echo "Server response matches expected value"

    # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
    #- name: Update dependency graph
    #  uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
