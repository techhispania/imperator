<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ appName }} Admin Panel</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
body {
	height: 100vh;
	overflow: hidden;
}

#sidebar {
	width: 300px;
	overflow-y: auto;
}

#main-content {
	overflow-y: auto;
	height: 100vh;
}
</style>
</head>
<body class="bg-light d-flex">

	<!-- Sidebar -->
	<aside id="sidebar" class="bg-white border-end p-4">
		<h4 class="mb-4 text-center">Deploy Application</h4>
		<form action="/deploy" method="POST" enctype="multipart/form-data"
			class="">
			<div class="mb-3">
				<label for="applicationType" class="form-label">Application
					Type</label> <select id="applicationType" name="applicationType"
					class="form-select" required>
					<option value="" selected disabled>-- Select application type --</option>
					<option value="jar">Standard JAR Application</option>
					<option value="spring-boot">Spring Boot Microservice</option>
					<option value="quarkus">Quarkus Application</option>
					<option value="micronaut">Micronaut Service</option>
				</select>
			</div>

			<div class="mb-3">
				<label for="applicationName" class="form-label">Application Name</label> 
				<input type="text" id="applicationName" name="applicationName" class="form-control" required>
			</div>

			<div class="mb-3">
				<label for="description" class="form-label">Description</label> 
				<input type="text" id="description" name="description" class="form-control" required>
			</div>

			<div class="mb-3">
				<label for="fileInput" class="form-label">Choose a file</label> 
				<input type="file" id="fileInput" name="file" class="form-control" required>
			</div>

			<button type="submit" class="btn btn-primary w-100">Deploy</button>
		</form>
	</aside>

	<!-- Main content -->
	<main id="main-content" class="flex-grow-1 p-4">
		<h2 class="text-center mb-4">Deployed Services</h2>

		<section id="servicesList" class="container">
			{% for application in applications %}
			<article class="card mb-3 shadow-sm">
				<div
					class="card-body d-flex align-items-center justify-content-between">
					<div class="d-flex align-items-center">
						<span class="status-indicator bg-success rounded-circle me-3"
							style="width: 15px; height: 15px; display: inline-block"></span>
						<header>
							<h5 class="mb-0">{{ application.name }}</h5>
							<small>Port: {{ application.port }} | PID: {{ application.pid }}</small>
						</header>
					</div>
					<nav>
						<button class="btn btn-success btn-sm me-1" onclick="confirmAction('start','Example Service')">Start</button>
						<button class="btn btn-warning btn-sm me-1" onclick="confirmAction('stop','Example Service')">Stop</button>
						<button class="btn btn-info btn-sm me-1" onclick="confirmAction('restart','Example Service')">Restart</button>
						<button class="btn btn-danger btn-sm" onclick="confirmAction('undeploy','Example Service')">Undeploy</button>
					</nav>
				</div>
			</article>
			{% endfor %}

			<!-- More services will be dynamically inserted here -->
		</section>
	</main>

	<script>
		function confirmAction(action, serviceName) {
			const ok = confirm(`Are you sure you want to ${action} the service: ${serviceName}?`);
			if (ok) {
				// TODO: Send POST request to your backend
				console.log(`Action confirmed: ${action} → ${serviceName}`);
			}
		}
	</script>

</body>
</html>
