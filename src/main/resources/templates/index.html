<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<title>Imperator Admin Panel</title>
	<link rel="stylesheet" href="/static/css/styles.css">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
	<header class="container py-5 text-center">
		<h1>Welcome to the Imperator Server Admin Panel.</h1>
		<p class="lead">
		Manage and deploy your Java applications, including standard JARs, Spring Boot microservices, etc...
		</p>
	</header>

	<main class="container">
		<section class="row justify-content-center">
			<article class="col-12 col-md-6">
				<form action="/deploy" method="POST" enctype="multipart/form-data" class="card p-4 shadow-sm bg-white">
					<fieldset>
						<legend class="h5 mb-3">Upload Your File</legend>

						<div class="mb-3">
							<label for="applicationType" class="form-label">Application Type</label>
							<select id="applicationType" name="applicationType" class="form-select" required>
								<option value="" selected disabled>-- Select application type --</option>
								<option value="jar">Standard JAR Application</option>
								<option value="spring-boot">Spring Boot Microservice</option>
								<option value="quarkus">Quarkus Application</option>
								<option value="micronaut">Micronaut Service</option>
							</select>
						</div>
						
						<div class="mb-3">
							<label for="applicationName" class="form-label">Application Name</label> 
							<input type="text" id="applicationName" name="applicationName" class="form-control" required>
						</div>

						<div class="mb-3">
							<label for="description" class="form-label">Description</label> 
							<input type="text" id="description" name="description" class="form-control" required>
						</div>

						<div class="mb-3">
							<label for="fileInput" class="form-label">Choose a file</label> 
							<input type="file" id="fileInput" name="file" class="form-control" required>
						</div>

						<button type="submit" class="btn btn-primary w-100">Deploy</button>
					</fieldset>
				</form>
			</article>
		</section>
	</main>
</body>
</html>
